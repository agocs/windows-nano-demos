# Builds and tests windows-nano-far for every Windows version through the shared workflow (ADR 0009)
name: Far Manager container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server-far/**'
      - '.github/workflows/far-manager.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server-far/**'
      - '.github/workflows/far-manager.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server-far
      image: windows-nano-far
