# Builds and tests windows-nano-gh-runner for every Windows version through the shared workflow (ADR 0009)
name: GitHub runner container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server-gh-runner/**'
      - '.github/workflows/gh-runner-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server-gh-runner/**'
      - '.github/workflows/gh-runner-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server-gh-runner
      image: windows-nano-gh-runner
