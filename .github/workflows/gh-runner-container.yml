name: GitHub runner container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server-gh-runner/**'
      - '.github/workflows/gh-runner-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server-gh-runner/**'
      - '.github/workflows/gh-runner-container.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    # Self-hosted runners have host docker access, so never run code from forks on them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, docker]
    strategy:
      fail-fast: false
      matrix:
        windows-version: ['2019', '2022', '2025']
    env:
      IMAGE: windows-nano-gh-runner:${{ matrix.windows-version }}-${{ github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --build-arg WINDOWS_VERSION=${{ matrix.windows-version }} -t $env:IMAGE nano-server-gh-runner

      - name: Smoke test
        run: |
          $script = @'
            $ErrorActionPreference = 'Stop'
            "pwsh $($PSVersionTable.PSVersion)"
            & powershell.exe -NoProfile -Command '"powershell.exe shim ok"'
            git --version
            git init -q C:\t
            git -C C:\t submodule foreach --recursive 'sh -c "true"'
            if ($LASTEXITCODE) { throw "git submodule failed: $LASTEXITCODE" }
            docker --version
            & C:\actions-runner\bin\Runner.Listener.exe --version
          '@
          # Encoded so quotes survive the trip through docker's command line
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $out = docker run --rm --entrypoint 'C:\Program Files\PowerShell\7\pwsh.exe' $env:IMAGE -NoProfile -EncodedCommand $encoded
          $out
          if ($LASTEXITCODE) { throw "smoke test failed: $LASTEXITCODE" }
          if (-not ($out -match 'powershell.exe shim ok')) { throw 'powershell.exe shim missing' }

      - name: Remove image
        if: always()
        run: |
          docker rmi -f $env:IMAGE
          exit 0
