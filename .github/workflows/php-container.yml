# Builds and tests windows-nano-php for every Windows version through the shared workflow (ADR 0009)
name: PHP container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server-php/**'
      - '.github/workflows/php-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server-php/**'
      - '.github/workflows/php-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server-php
      image: windows-nano-php
