# Builds and tests windows-nano-powershell for every Windows version through the shared workflow (ADR 0009)
name: PowerShell container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server-powershell/**'
      - '.github/workflows/powershell-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server-powershell/**'
      - '.github/workflows/powershell-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server-powershell
      image: windows-nano-powershell
