# Builds and tests windows-nano-rust for every Windows version through the shared workflow (ADR 0009)
name: Rust container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server-rust/**'
      - '.github/workflows/rust-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server-rust/**'
      - '.github/workflows/rust-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server-rust
      image: windows-nano-rust
